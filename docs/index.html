<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>麦卡收藏家 · 麦当劳抽卡</title>
<meta name="description" content="基于麦当劳 MCP 数据的卡牌收集玩法：按健康度分级SSR/UR/R，标注价格与卡路里，积分每4小时恢复。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
/* 横幅背景图：桌面端与移动端各一张，避免移动端拉伸变形 */
@media(min-width:621px){ .hero-bg{background-image:url(assets/hero.jpg)} }
@media(max-width:620px){ .hero-bg{background-image:url(assets/hero-mobile.jpg)} }
</style>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
 /* 麦当劳品牌色 */
 --mcd-red:#DA291C;--mcd-red-d:#8E1509;--mcd-gold:#FFC72C;--mcd-gold-d:#E09A00;
 /* 稀有度主题 */
 --ssr-a:#FFE9A8;--ssr-b:#FFC72C;--ssr-c:#FF7A00;
 --ur-a:#FFD3E4;--ur-b:#FF5C9D;--ur-c:#B3155E;
 --r-a:#CFE4FF;--r-b:#5AA9F0;--r-c:#1B5FA8;
 --bg:#140705;--txt:#FFF4E8;--dim:#C9A28E;
 --safe-b:env(safe-area-inset-bottom,0px);
 --font:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
 /* 展示字体：Orbitron 用于数值（科技感几何体），Rajdhani 用于拉丁标签 */
 --f-num:"Orbitron","Rajdhani",ui-monospace,"SF Mono",var(--font);
 --f-lab:"Rajdhani","PingFang SC","Microsoft YaHei",var(--font);
}
body{
 font-family:var(--font);
 background:var(--bg);color:var(--txt);min-height:100vh;padding:0 0 calc(34px + var(--safe-b));
 -webkit-tap-highlight-color:transparent;
 background-image:
  radial-gradient(ellipse 70% 40% at 50% -8%,rgba(255,199,44,.16),transparent 70%),
  radial-gradient(ellipse 60% 45% at 12% 30%,rgba(218,41,28,.15),transparent 70%),
  radial-gradient(ellipse 60% 45% at 88% 62%,rgba(255,92,157,.10),transparent 70%);
 background-attachment:fixed;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* ============ 顶部 Hero 横幅 ============ */
.hero{position:relative;margin:0 -16px 22px;padding:0;
 height:250px;overflow:hidden;
 border-bottom:3px solid rgba(255,199,44,.32)}
/* 背景层：默认纯 CSS 渐变，替换为生图后走 .hero.has-img */
.hero-bg{position:absolute;inset:0;z-index:0;
 background:
  radial-gradient(ellipse 58% 90% at 76% 46%,rgba(255,199,44,.28),transparent 62%),
  radial-gradient(ellipse 52% 84% at 92% 78%,rgba(218,41,28,.30),transparent 66%),
  radial-gradient(ellipse 46% 76% at 60% 20%,rgba(255,92,157,.14),transparent 66%),
  linear-gradient(160deg,#1E0B07,#140705 55%,#0D0403)}
.hero.has-img .hero-bg{background-size:cover;background-position:center right}
/* 左侧压暗，保证文字可读 */
.hero::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
 background:linear-gradient(90deg,rgba(14,5,3,.97) 0%,rgba(14,5,3,.93) 38%,
   rgba(14,5,3,.62) 62%,rgba(14,5,3,.18) 100%)}

/* 金色粒子层（覆盖在背景图上，增加呼吸感） */
.hero-cards{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.hero-cards i{position:absolute;border-radius:50%;
 background:radial-gradient(circle,rgba(255,238,190,.95),rgba(255,199,44,.5) 42%,transparent 72%);
 box-shadow:0 0 10px rgba(255,199,44,.6);
 animation-name:hcFloat;animation-timing-function:ease-in-out;
 animation-iteration-count:infinite;animation-direction:alternate}
@keyframes hcFloat{
 0%{transform:translateY(0) scale(.7);opacity:.2}
 50%{opacity:.85}
 100%{transform:translateY(-38px) scale(1.15);opacity:.05}
}

/* ============ Hero 内的餐品图鉴轮播 ============ */
.hero-shelf{position:absolute;right:4.5%;top:50%;transform:translateY(-50%);z-index:4;
 display:flex;align-items:center;gap:11px;pointer-events:none}
.hs-card{width:78px;height:112px;border-radius:10px;position:relative;overflow:hidden;
 background:linear-gradient(160deg,#3A1A10,#1A0A06);
 border:1.5px solid rgba(255,199,44,.3);
 box-shadow:0 8px 24px rgba(0,0,0,.55);
 transition:transform .5s cubic-bezier(.34,1.4,.64,1),box-shadow .3s,opacity .3s}
.hs-card:nth-child(1){transform:rotate(-9deg) translateY(10px);opacity:.62;z-index:1}
.hs-card:nth-child(3){transform:rotate(9deg) translateY(10px);opacity:.62;z-index:1}
.hs-card img{width:100%;height:100%;object-fit:cover;display:block}
.hs-card::after{content:"";position:absolute;inset:0;
 background:linear-gradient(180deg,transparent 48%,rgba(18,7,4,.9) 100%)}
/* 未收集：剪影 + 锁 */
.hs-card.locked img{filter:grayscale(1) brightness(.3) contrast(.7)}
.hs-card.locked::before{content:"🔒";position:absolute;inset:0;z-index:3;
 display:flex;align-items:center;justify-content:center;font-size:20px;
 filter:drop-shadow(0 2px 6px rgba(0,0,0,.7))}
.hs-name{position:absolute;left:5px;right:5px;bottom:5px;z-index:4;
 font-size:8.5px;font-weight:700;color:#FFE9B8;text-align:center;line-height:1.2;
 text-shadow:0 1px 4px rgba(0,0,0,.9)}
.hs-rar{position:absolute;top:4px;left:4px;z-index:4;font-family:var(--f-num);
 font-size:8px;font-weight:900;letter-spacing:.5px;color:#2A0E04;
 padding:1px 5px;border-radius:3px 6px 6px 3px;transform:skewX(-8deg)}
.hs-mid .hs-card:nth-child(2){width:104px;height:150px;
 border-color:var(--mcd-gold);
 box-shadow:0 14px 36px rgba(0,0,0,.6),0 0 40px rgba(255,199,44,.42)}
.hs-mid .hs-card:nth-child(2) .hs-name{font-size:10px}
.hs-mid .hs-card:nth-child(2) .hs-rar{font-size:9.5px;padding:2px 6px}
.hero:hover .hs-card:nth-child(1){transform:rotate(-13deg) translateY(4px)}
.hero:hover .hs-mid .hs-card:nth-child(2){transform:translateY(-8px)}
.hero:hover .hs-card:nth-child(3){transform:rotate(13deg) translateY(4px)}

/* 文案层 */
.hero-txt{position:relative;z-index:3;padding:44px 16px 0;max-width:640px}
.hero-txt h1{margin:0;font-size:40px;font-weight:900;letter-spacing:3px;color:#fff;
 text-shadow:0 3px 0 var(--mcd-red-d),0 2px 10px rgba(0,0,0,.7),0 10px 30px rgba(0,0,0,.5)}
.hero-en{margin-top:10px;font-family:var(--f-num);font-size:12.5px;font-weight:700;
 letter-spacing:5.5px;color:var(--mcd-gold);text-shadow:0 2px 8px rgba(0,0,0,.7)}
.hero-slogan{margin:14px 0 0;font-size:14.5px;letter-spacing:1.2px;color:#FFD9A0;
 text-shadow:0 2px 8px rgba(0,0,0,.8)}
.store-tag{display:inline-block;margin-top:15px;font-size:11px;color:#FFDCA8;
  background:rgba(0,0,0,.28);border:1px solid rgba(255,201,44,.34);
  padding:7px 14px;border-radius:999px;cursor:pointer;
  transition:.2s;backdrop-filter:blur(6px);max-width:100%;}
.store-tag:hover{border-color:rgba(255,201,44,.75);background:rgba(0,0,0,.42);}
.store-tag.sel{border-color:#FFC72C;color:#FFE9B0;}

/* ---------- 门店选择 / 下单弹窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(12,8,4,.82);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;z-index:900;padding:18px;
  font-family:var(--ui-fallback);}
.mask.on{display:flex;}
.sheet{width:100%;max-width:440px;max-height:88vh;overflow-y:auto;
  background:linear-gradient(165deg,#241608,#150d05);
  border:1px solid rgba(255,201,44,.36);border-radius:20px;padding:22px;
  box-shadow:0 26px 70px rgba(0,0,0,.72),inset 0 1px 0 rgba(255,255,255,.07);}
.sheet h3{margin:0 0 4px;font-size:17px;color:#FFD98A;letter-spacing:.6px;}
.sheet .sub{font-size:11.5px;color:#B79A72;margin-bottom:15px;line-height:1.6;}
.field{margin-bottom:11px;}
.field label{display:block;font-size:10.5px;letter-spacing:1.4px;
  text-transform:uppercase;color:#C0A075;margin-bottom:5px;}
.field input,.field select{width:100%;padding:10px 12px;border-radius:11px;
  background:rgba(0,0,0,.36);border:1px solid rgba(255,201,44,.24);
  color:#FFE9C4;font-size:14px;outline:none;font-family:inherit;}
.field input:focus,.field select:focus{border-color:#FFC72C;}
.segs{display:flex;gap:8px;}
.seg{flex:1;padding:9px 6px;border-radius:11px;text-align:center;font-size:12.5px;
  background:rgba(0,0,0,.3);border:1px solid rgba(255,201,44,.2);color:#CDB188;
  cursor:pointer;transition:.18s;}
.seg.on{background:linear-gradient(135deg,#FFC72C,#FF9E1B);color:#2A1A06;
  font-weight:700;border-color:transparent;}
.sbtn{width:100%;margin-top:6px;padding:12px;border:none;border-radius:13px;
  background:linear-gradient(135deg,#FFC72C,#FF9E1B);color:#2A1A06;
  font-size:14.5px;font-weight:800;letter-spacing:.6px;cursor:pointer;font-family:inherit;
  box-shadow:0 8px 22px rgba(255,158,27,.3);}
.sbtn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;}
.sbtn.ghost{background:rgba(255,255,255,.07);color:#E7D3AE;
  border:1px solid rgba(255,201,44,.28);box-shadow:none;margin-top:9px;}
.slist{margin-top:14px;display:flex;flex-direction:column;gap:8px;}
.sitem{padding:12px 13px;border-radius:13px;cursor:pointer;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,201,44,.16);
  transition:.18s;text-align:left;color:inherit;font-family:inherit;}
.sitem:hover{border-color:rgba(255,201,44,.55);background:rgba(255,201,44,.09);}
.sitem.on{border-color:#FFC72C;background:rgba(255,201,44,.15);}
.sitem .nm{font-size:13.5px;color:#FFE9C4;font-weight:600;line-height:1.4;}
.sitem .mt{font-size:11px;color:#AE9068;margin-top:3px;
  display:flex;gap:9px;flex-wrap:wrap;}
.sitem .dist{color:#FFC72C;font-weight:700;}
.hint{font-size:11.5px;color:#B08A55;margin-top:12px;line-height:1.65;
  padding-top:11px;border-top:1px solid rgba(255,201,44,.16);}
.hint b{color:#FFD98A;}
.err{background:rgba(200,50,40,.16);border:1px solid rgba(255,90,80,.4);
  color:#FFB3A8;padding:10px 12px;border-radius:11px;font-size:12.5px;
  margin-top:11px;line-height:1.55;}
.sum{background:rgba(0,0,0,.32);border:1px solid rgba(255,201,44,.24);
  border-radius:14px;padding:14px;margin-top:13px;}
.sum .ln{display:flex;justify-content:space-between;font-size:12.5px;
  color:#C9AF87;padding:4px 0;}
.sum .ln.tot{border-top:1px dashed rgba(255,201,44,.28);margin-top:7px;
  padding-top:9px;font-size:15px;color:#FFD98A;font-weight:800;}
.ok{text-align:center;padding:8px 0;}
.ok .tick{font-size:40px;line-height:1;}
.ok .oid{font-family:var(--mono);font-size:12.5px;color:#FFD98A;
  background:rgba(0,0,0,.35);padding:9px;border-radius:10px;margin:12px 0;
  word-break:break-all;}
.paylink{display:block;width:100%;padding:13px;border:none;border-radius:13px;
  background:linear-gradient(135deg,#DA291C,#FF6B35);color:#fff;font-size:15px;
  font-weight:800;cursor:pointer;text-decoration:none;text-align:center;font-family:inherit;
  box-shadow:0 8px 22px rgba(218,41,28,.34);margin-top:6px;}
@media(max-width:480px){ .sheet{padding:18px;border-radius:17px;} }
 background:rgba(218,41,28,.34);border:1px solid rgba(255,199,44,.36);
 padding:5px 13px;border-radius:20px;font-family:var(--f-lab);letter-spacing:.5px}

/* ============ 积分条 ============ */
.points{
 position:sticky;top:0;z-index:60;margin:0 -16px 20px;padding:11px 16px;
 background:rgba(20,7,5,.96);backdrop-filter:blur(14px);
 border-bottom:1px solid rgba(255,199,44,.22);
 display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pt-num{font-family:var(--f-num);font-size:26px;font-weight:900;color:var(--mcd-gold);
 line-height:1;letter-spacing:.5px;text-shadow:0 0 16px rgba(255,199,44,.55)}
.pt-lab{font-family:var(--f-lab);font-size:10.5px;color:var(--dim);margin-top:3px;letter-spacing:1px}
/* 刷新积分按钮 */
.pt-refill{margin-left:auto;display:inline-flex;align-items:center;gap:7px;
 padding:8px 15px 8px 12px;border:none;border-radius:20px;cursor:pointer;
 font-family:var(--f-lab);font-size:12.5px;font-weight:700;letter-spacing:.6px;
 color:#3A1408;background:linear-gradient(120deg,#FFD45E,var(--mcd-gold) 55%,#F09400);
 box-shadow:0 3px 10px rgba(255,160,0,.34),inset 0 1px 0 rgba(255,255,255,.44);
 transition:.18s;position:relative;overflow:hidden}
.pt-refill svg{width:15px;height:15px;transition:transform .5s cubic-bezier(.34,1.5,.64,1)}
.pt-refill:hover{filter:brightness(1.08);transform:translateY(-1px);
 box-shadow:0 5px 14px rgba(255,160,0,.44),inset 0 1px 0 rgba(255,255,255,.44)}
.pt-refill:hover svg{transform:rotate(180deg)}
.pt-refill:active{transform:translateY(1px)}
.pt-refill.full{filter:saturate(.4) brightness(.82);cursor:default;
 box-shadow:0 2px 6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.2)}
.pt-refill.full:hover{transform:none;filter:saturate(.4) brightness(.82)}
.pt-refill.full:hover svg{transform:none}
.pt-refill.cool{pointer-events:none}
.pt-refill.cool::after{content:"";position:absolute;inset:0;background:rgba(20,7,5,.42)}
.pt-refill.cool svg{position:relative;z-index:2}

/* ============ 控制台 · 紧凑工具条 ============ */
.ctrl{
 background:linear-gradient(120deg,rgba(46,18,12,.72),rgba(24,9,6,.62));
 border:1px solid rgba(255,199,44,.16);border-radius:14px;
 padding:13px 15px;margin-bottom:20px;
 box-shadow:0 3px 14px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.045)}
.ctrl-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{flex:1;min-width:210px}
.field label{display:block;font-family:var(--f-lab);font-size:10px;color:#C98F6A;
 margin-bottom:6px;letter-spacing:1.4px;font-weight:700;text-transform:uppercase}
/* 输入框与分段按钮同一行 */
.ctrl-in{display:flex;align-items:stretch;gap:7px}
.ctrl-in input{
 flex:none;width:74px;padding:8px 10px;font-family:var(--f-num);
 font-size:14px;font-weight:700;
 background:rgba(0,0,0,.44);border:1px solid rgba(255,199,44,.2);
 border-radius:9px;color:var(--mcd-gold);outline:none;text-align:center;
 transition:.18s}
.ctrl-in input::placeholder{color:#7A5A48;font-size:12px;font-weight:600}
.ctrl-in input:focus{border-color:var(--mcd-gold);
 box-shadow:0 0 0 2.5px rgba(255,199,44,.16);background:rgba(0,0,0,.6)}

/* 分段控制器 */
.segs{display:flex;flex:1;gap:3px;padding:3px;border-radius:10px;
 background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.055)}
.seg{
 flex:1;padding:7px 4px;border:none;border-radius:7px;cursor:pointer;
 background:transparent;color:#B08D7C;font-family:var(--f-lab);
 font-size:12px;font-weight:700;letter-spacing:.4px;
 transition:.18s;white-space:nowrap;min-width:0}
.seg:hover{background:rgba(255,199,44,.1);color:#FFD9A0}
.seg.on{background:linear-gradient(140deg,var(--mcd-gold),#E09A00);
 color:#3A1408;box-shadow:0 2px 8px rgba(255,199,44,.36);
 font-weight:700;letter-spacing:.5px}

/* 主按钮 */
.btn-draw{
 width:100%;margin-top:11px;padding:14px;border:none;border-radius:11px;
 font-family:var(--f-num);font-size:16px;font-weight:900;letter-spacing:5px;
 cursor:pointer;color:#3A1408;position:relative;overflow:hidden;
 background:linear-gradient(100deg,#FFD45E 0%,var(--mcd-gold) 42%,#FF9A1F 100%);
 box-shadow:0 5px 0 #A33A12,0 8px 22px rgba(255,138,0,.34);
 transition:.16s;text-shadow:0 1px 0 rgba(255,255,255,.34)}
.btn-draw .bd{position:relative;z-index:2}
.btn-draw::after{content:"";position:absolute;inset:0;z-index:1;
 background:linear-gradient(100deg,transparent 34%,rgba(255,255,255,.5) 50%,transparent 66%);
 transform:translateX(-120%);transition:transform .6s ease}
.btn-draw:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-2px);
 box-shadow:0 7px 0 #A33A12,0 12px 28px rgba(255,138,0,.42)}
.btn-draw:hover:not(:disabled)::after{transform:translateX(120%)}
.btn-draw:active:not(:disabled){transform:translateY(3px);
 box-shadow:0 2px 0 #A33A12,0 5px 14px rgba(255,138,0,.3)}
/* 禁用态：保留品牌色，降饱和而非死灰 */
.btn-draw:disabled{
 background:linear-gradient(100deg,#5A3A26,#43301F);
 color:#A8866E;cursor:not-allowed;
 box-shadow:0 3px 0 #2A1A10;text-shadow:none;border:1px solid rgba(255,199,44,.14)}
.btn-draw:disabled .bd{opacity:.8}

.hint{margin-top:9px;text-align:center;font-size:11px;color:#A8806F;line-height:1.6;
 letter-spacing:.3px}
.hint b{color:var(--mcd-gold)}
.hint .warn{color:#FFB27A;font-weight:700}

/* ============ 统计：页面最下的一条细窄数据带 ============ */
.stats{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
 gap:7px 15px;margin:26px auto 0;padding:11px 18px;width:fit-content;max-width:100%;
 background:linear-gradient(180deg,rgba(255,199,44,.1),rgba(218,41,28,.06));
 border:1px solid rgba(255,199,44,.2);border-radius:20px}
.stat{display:flex;align-items:baseline;gap:4px;white-space:nowrap}
.stat .v{font-family:var(--f-num);font-size:14px;font-weight:900;color:var(--mcd-gold);
 line-height:1;letter-spacing:.2px}
.stat .k{font-family:var(--f-lab);font-size:10px;color:var(--dim);letter-spacing:.6px}
.stat.ssr .v{color:var(--ssr-b)}.stat.ur .v{color:var(--ur-b)}.stat.r .v{color:var(--r-b)}
.stat.combo .v{color:var(--mcd-red)}

/* ============ 分区标题 ============ */
.st{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:900;
 margin:26px 0 15px;color:var(--mcd-gold);letter-spacing:.6px}
.st::before{content:"";width:5px;height:17px;
 background:linear-gradient(180deg,var(--mcd-gold),var(--mcd-red));border-radius:2px}
.st small{margin-left:auto;font-size:11.5px;color:var(--dim);font-weight:500}
/* 清空收藏册：低调的幽灵按钮，hover 才显红 */
.btn-clear{margin-left:8px;font-family:var(--f-lab);font-size:10.5px;font-weight:700;
 letter-spacing:.5px;color:var(--dim);background:transparent;cursor:pointer;
 border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:3px 11px;
 transition:all .2s;white-space:nowrap}
.btn-clear:hover{color:#FF8A76;border-color:rgba(255,138,118,.5);
 background:rgba(255,138,118,.09)}
.btn-clear:active{transform:scale(.96)}

/* ============ 卡牌 · 二次元游戏风 ============ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:15px}

.card{position:relative;border-radius:17px;padding:3px;cursor:pointer;
 transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .22s;transform-style:preserve-3d}
.card:hover{transform:translateY(-8px) scale(1.025);z-index:5}
.card:active{transform:scale(.975)}

.card-in{
 position:relative;border-radius:14px;overflow:hidden;min-height:352px;
 display:flex;flex-direction:column;
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.09),inset 0 -30px 46px rgba(0,0,0,.42)}

/* 稀有度主题变量注入点 */
.t-SSR{--c1:var(--ssr-a);--c2:var(--ssr-b);--c3:var(--ssr-c);--gl:rgba(255,199,44,.72)}
.t-UR {--c1:var(--ur-a); --c2:var(--ur-b); --c3:var(--ur-c);--gl:rgba(255,92,157,.55)}
.t-R  {--c1:var(--r-a);  --c2:var(--r-b); --c3:var(--r-c); --gl:rgba(90,169,240,.44)}

/* --- 卡面图片区：主体，不被任何元素遮挡 --- */
.art{position:relative;width:100%;height:196px;flex:none;overflow:hidden;
 background:linear-gradient(155deg,var(--c3),#120704)}
.art img{width:100%;height:100%;object-fit:cover;display:block;
 transition:transform .5s cubic-bezier(.34,1.3,.64,1)}
.card:hover .art img{transform:scale(1.07)}
.art::after{content:"";position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(180deg,transparent 46%,rgba(18,7,4,.88) 100%)}
/* 图片为白底商品图时，加一层暖色调适配 */
.art::before{content:"";position:absolute;inset:0;z-index:1;
 background:radial-gradient(ellipse at 50% 42%,transparent 52%,rgba(18,7,4,.34) 100%)}

/* ================= 卡面特效 =================
   三种：flash 闪卡 / silver 银碎 / gold 金卡
   **覆盖整张卡面**（不是只盖图片区），**不加任何描边**，
   全部用粒子 + 光效实现，保持通透不遮挡内容 */
.foil{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden;
 border-radius:14px;
 /* 独立合成层：避免 mix-blend-mode 与卡片背景反复重绘导致抖动 */
 will-change:transform,opacity;transform:translateZ(0);
 backface-visibility:hidden}

/* --- 闪卡：整卡斜向彩虹流光（3 道光带同时扫过）--- */
.foil-flash::before{
 content:"";position:absolute;inset:-70% -30%;
 background:linear-gradient(112deg,
   transparent 0%,transparent 22%,
   rgba(255,255,255,.14) 30%,rgba(120,220,255,.42) 36%,
   rgba(255,255,255,.58) 40%,rgba(200,150,255,.40) 45%,
   rgba(255,255,255,.50) 49%,rgba(255,210,130,.36) 54%,
   transparent 64%,transparent 100%);
 animation:foilSweep 6.5s cubic-bezier(.4,0,.25,1) infinite;
 mix-blend-mode:screen}
@keyframes foilSweep{
 0%{transform:translateX(-78%) skewX(-8deg);opacity:0}
 30%{opacity:0}
 42%{opacity:.85}
 62%{opacity:.85}
 74%{opacity:0}
 100%{transform:translateX(78%) skewX(-8deg);opacity:0}}
/* 第二道反向细光带，制造交错感 */
.foil-flash::after{
 content:"";position:absolute;inset:-70% -30%;
 background:linear-gradient(112deg,
   transparent 0%,transparent 34%,
   rgba(255,255,255,.36) 42%,rgba(255,255,255,.50) 46%,
   rgba(160,240,255,.32) 50%,transparent 58%,transparent 100%);
 animation:foilSweep2 6.5s cubic-bezier(.4,0,.25,1) infinite;
 mix-blend-mode:screen}
@keyframes foilSweep2{
 0%{transform:translateX(-88%) skewX(-8deg);opacity:0}
 44%{opacity:0}
 55%{opacity:.7}
 70%{opacity:.7}
 80%{opacity:0}
 100%{transform:translateX(88%) skewX(-8deg);opacity:0}}
/* 闪卡：整卡彩虹氛围光（不用描边） */
.foil-halo.flash-glow{background:
  radial-gradient(ellipse 130% 55% at 50% 0%,rgba(160,220,255,.18),transparent 64%),
  radial-gradient(ellipse 110% 50% at 50% 100%,rgba(255,170,230,.14),transparent 60%),
  radial-gradient(circle at 50% 45%,rgba(200,190,255,.12),transparent 54%);
 mix-blend-mode:screen;animation:foilBreath 3s ease-in-out infinite}

/* --- 银碎：整卡银色箔片粒子（12 颗，大小不一，缓慢漂浮）--- */
.foil-silver::before{
 content:"";position:absolute;inset:0;
 background-image:
  radial-gradient(circle at 14% 18%,rgba(255,255,255,.92) 0 1.6px,transparent 2.4px),
  radial-gradient(circle at 42% 12%,rgba(214,238,255,.80) 0 1.2px,transparent 2px),
  radial-gradient(circle at 72% 22%,rgba(255,255,255,.86) 0 1.8px,transparent 2.6px),
  radial-gradient(circle at 90% 14%,rgba(196,224,250,.74) 0 1.3px,transparent 2.1px),
  radial-gradient(circle at 26% 38%,rgba(255,255,255,.78) 0 1.4px,transparent 2.2px),
  radial-gradient(circle at 58% 44%,rgba(226,244,255,.88) 0 1.7px,transparent 2.5px),
  radial-gradient(circle at 84% 40%,rgba(255,255,255,.70) 0 1.2px,transparent 2px),
  radial-gradient(circle at 10% 62%,rgba(206,230,255,.82) 0 1.5px,transparent 2.3px),
  radial-gradient(circle at 38% 70%,rgba(255,255,255,.90) 0 1.8px,transparent 2.6px),
  radial-gradient(circle at 66% 62%,rgba(220,240,255,.76) 0 1.3px,transparent 2.1px),
  radial-gradient(circle at 88% 74%,rgba(255,255,255,.84) 0 1.6px,transparent 2.4px),
  radial-gradient(circle at 22% 86%,rgba(230,246,255,.80) 0 1.4px,transparent 2.2px),
  radial-gradient(circle at 52% 92%,rgba(255,255,255,.76) 0 1.5px,transparent 2.3px),
  radial-gradient(circle at 78% 90%,rgba(210,234,255,.72) 0 1.2px,transparent 2px);
 background-size:190px 210px,230px 190px,170px 240px,210px 200px,
                250px 220px,180px 260px,220px 180px,200px 240px;
 mix-blend-mode:screen;
 animation:foilFloat 7s ease-in-out infinite}
@keyframes foilFloat{
 0%{background-position:0 0,20px 10px,40px 0,10px 20px,
              30px 5px,0 25px,15px 35px,35px 15px,
              5px 40px,25px 30px,45px 20px,20px 45px,
              40px 35px,10px 50px; opacity:.74}
 50%{background-position:9px -7px,13px 11px,29px 4px,17px 10px,
              25px 8px,5px 18px,11px 26px,30px 11px,
              10px 30px,20px 21px,40px 14px,25px 33px,
              32px 27px,15px 40px; opacity:.86}
 100%{background-position:18px -14px,-14px 12px,-22px -8px,12px -20px,
              -20px -10px,16px -22px,-12px 8px,20px -16px,
              -8px -24px,14px -20px,-18px -6px,10px -26px,
              -16px -20px,8px -30px; opacity:.74}}
/* 银碎：整卡冷银氛围光（不用描边） */
.foil-silver::after{
 content:"";position:absolute;inset:0;
 background:
  radial-gradient(ellipse 120% 60% at 50% 0%,rgba(200,230,255,.20),transparent 62%),
  radial-gradient(ellipse 100% 50% at 50% 100%,rgba(150,190,225,.16),transparent 58%);
 mix-blend-mode:screen;animation:foilBreath 4.5s ease-in-out infinite}
@keyframes foilBreath{0%,100%{opacity:.82}50%{opacity:1}}

/* --- 金卡：整卡金粉粒子（14 颗）+ 鎏金光晕（不用描边）--- */
.foil-gold::before{
 content:"";position:absolute;inset:0;
 background-image:
  radial-gradient(circle at 16% 14%,rgba(255,240,186,1) 0 4.2px,transparent 5.8px),
  radial-gradient(circle at 46% 8%,rgba(255,206,72,.96) 0 3.2px,transparent 4.6px),
  radial-gradient(circle at 76% 17%,rgba(255,248,200,1) 0 4.6px,transparent 6.2px),
  radial-gradient(circle at 93% 9%,rgba(255,192,44,.94) 0 3px,transparent 4.4px),
  radial-gradient(circle at 28% 31%,rgba(255,224,124,.97) 0 3.7px,transparent 5.1px),
  radial-gradient(circle at 62% 37%,rgba(255,252,220,1) 0 4.4px,transparent 6px),
  radial-gradient(circle at 87% 33%,rgba(255,208,64,.94) 0 3.2px,transparent 4.6px),
  radial-gradient(circle at 7% 55%,rgba(255,240,170,.97) 0 3.9px,transparent 5.3px),
  radial-gradient(circle at 40% 61%,rgba(255,198,40,.96) 0 3.4px,transparent 5px),
  radial-gradient(circle at 70% 57%,rgba(255,250,204,1) 0 4.1px,transparent 5.6px),
  radial-gradient(circle at 91% 65%,rgba(255,214,74,.94) 0 3.2px,transparent 4.6px),
  radial-gradient(circle at 19% 81%,rgba(255,232,150,.97) 0 3.7px,transparent 5.1px),
  radial-gradient(circle at 54% 87%,rgba(255,253,218,1) 0 4.3px,transparent 5.9px),
  radial-gradient(circle at 83% 85%,rgba(255,198,42,.94) 0 3px,transparent 4.4px),
  radial-gradient(circle at 34% 46%,rgba(255,244,184,.85) 0 2.6px,transparent 4px),
  radial-gradient(circle at 79% 50%,rgba(255,210,80,.82) 0 2.4px,transparent 3.8px);
 background-size:165px 195px,200px 168px,145px 210px,185px 176px,
                215px 200px,160px 226px,145px 185px,200px 164px,170px 200px;
 mix-blend-mode:screen;
 animation:foilFloat 4.6s ease-in-out infinite}
/* 金卡：整卡鎏金氛围光（顶部+底部+侧向光晕，不用描边） */
.foil-gold::after{
 content:"";position:absolute;inset:0;
 background:
  radial-gradient(ellipse 142% 64% at 50% -6%,rgba(255,206,90,.55),transparent 66%),
  radial-gradient(ellipse 122% 54% at 50% 106%,rgba(255,172,26,.42),transparent 62%),
  radial-gradient(ellipse 92% 44% at 22% 64%,rgba(255,224,132,.24),transparent 66%),
  radial-gradient(ellipse 88% 40% at 82% 40%,rgba(255,216,110,.20),transparent 64%),
  radial-gradient(circle at 50% 44%,rgba(255,234,162,.20),transparent 56%);
 mix-blend-mode:screen;animation:foilBreath 2.6s ease-in-out infinite}

/* --- 金卡：中心缓慢旋转的金色光轮（提升辨识度）--- */
.foil-halo{position:absolute;left:50%;top:34%;width:190px;height:190px;
 margin:-95px 0 0 -95px;border-radius:50%;pointer-events:none;
 background:conic-gradient(from 0deg,
   transparent 0deg,rgba(255,214,120,.30) 40deg,transparent 90deg,
   transparent 180deg,rgba(255,196,80,.26) 220deg,transparent 270deg);
 -webkit-mask:radial-gradient(circle,transparent 34%,#000 52%,transparent 72%);
 mask:radial-gradient(circle,transparent 34%,#000 52%,transparent 72%);
 mix-blend-mode:screen;animation:haloSpin 9s linear infinite;z-index:1;
 will-change:transform;transform:translateZ(0)}
@keyframes haloSpin{to{transform:rotate(360deg)}}

/* --- 银碎：中心冷光轮 --- */
.foil-halo.silver{background:conic-gradient(from 0deg,
   transparent 0deg,rgba(220,240,255,.28) 50deg,transparent 110deg,
   transparent 200deg,rgba(190,220,250,.24) 250deg,transparent 320deg);
 animation-duration:12s}

/* --- 闪卡：中心彩虹环 --- */
.foil-halo.flash{background:conic-gradient(from 0deg,
   transparent 0deg,rgba(255,120,200,.24) 35deg,rgba(120,220,255,.26) 70deg,
   rgba(255,220,120,.24) 105deg,transparent 145deg,
   transparent 215deg,rgba(160,240,255,.22) 250deg,rgba(255,150,220,.22) 285deg,
   transparent 330deg);
 animation-duration:7s}
/* 闪卡版标签：与普通版区分 */
.cn .tier.flashvar{color:#0E2030;background:linear-gradient(120deg,#9FE8FF,#C9A6FF 50%,#FFE08A);
 padding:2px 8px;font-weight:700;letter-spacing:.6px;
 box-shadow:0 2px 10px rgba(140,220,255,.55),inset 0 1px 0 rgba(255,255,255,.6)}

/* 特效徽记（贴在卡名上方，不遮挡卡面） */
.foil-mark{position:absolute;right:9px;bottom:calc(100% + 0px);z-index:8;
 font-family:var(--f-lab);font-size:8.5px;font-weight:700;letter-spacing:.5px;
 padding:2px 7px;border-radius:10px;line-height:1.25;pointer-events:none;
 backdrop-filter:blur(2px)}
.foil-mark::before{content:"✦ ";opacity:.85}
.foil-mark.flash{color:#BFE9FF;background:rgba(90,170,255,.22);border:1px solid rgba(140,210,255,.5)}
.foil-mark.silver{color:#E6F0FF;background:rgba(180,200,225,.20);border:1px solid rgba(210,228,255,.48)}
.foil-mark.gold{color:#3A2000;background:linear-gradient(120deg,#FFE9A8,#FFC72C);
 border:1px solid rgba(255,220,140,.9);box-shadow:0 0 8px rgba(255,199,44,.5)}

@media (prefers-reduced-motion:reduce){
 .foil::before,.foil::after{animation:none!important}
 .foil-flash::before{opacity:.32}
 .foil-silver::before,.foil-gold::before{opacity:.7}
 .foil-halo{animation:none!important}
 .rar-tag,.score,.new{animation:none!important}
}
/* 无图餐品占位：按品类上色 + 大图标，避免大片空白 */
.art .ph{position:absolute;inset:0;display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:6px;z-index:2;
 background:radial-gradient(ellipse at 50% 38%,var(--c3) 0%,#0d0503 78%)}
.art .ph .ph-ico{font-size:52px;line-height:1;
 filter:drop-shadow(0 4px 14px rgba(0,0,0,.7));opacity:.92}
.art .ph .ph-txt{font-family:var(--f-lab);font-size:9.5px;font-weight:700;
 letter-spacing:2px;color:var(--dim);text-align:center;padding:0 10px}

/* --- 稀有度角标：斜切横幅，醒目 --- */
.rar-tag{
 position:absolute;top:10px;left:9px;z-index:6;
 display:flex;align-items:center;gap:4px;padding:4px 13px 4px 10px;
 font-family:var(--f-num);font-size:12.5px;font-weight:900;letter-spacing:1.6px;color:#2A0E04;
 background:linear-gradient(120deg,var(--c1),var(--c2) 52%,var(--c3));
 border-radius:4px 11px 11px 4px;
 box-shadow:0 3px 12px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.5);
 transform:skewX(-9deg)}
.rar-tag span{transform:skewX(9deg)}
.card.t-SSR .rar-tag{animation:rarGlow 2.1s ease-in-out infinite}
@keyframes rarGlow{
 0%,100%{box-shadow:0 3px 12px rgba(0,0,0,.5),0 0 6px 1px rgba(255,199,44,.34),inset 0 1px 0 rgba(255,255,255,.5)}
 50%    {box-shadow:0 3px 12px rgba(0,0,0,.5),0 0 10px 2px rgba(255,199,44,.44),inset 0 1px 0 rgba(255,255,255,.5)}
}
/* SSR额外角标光点 */
.card.t-SSR .rar-tag::after{
 content:"";position:absolute;top:-5px;right:-5px;width:11px;height:11px;border-radius:50%;
 background:radial-gradient(circle,#fff,var(--mcd-gold));box-shadow:0 0 12px 3px rgba(255,231,168,.9)}

/* --- 卡名：压在图片下沿渐变上，不遮主体 --- */
.cn{position:absolute;left:11px;right:11px;bottom:8px;z-index:5;
 font-size:14px;font-weight:900;line-height:1.24;color:#fff;letter-spacing:.2px;
 white-space:normal;word-break:break-word;
 text-shadow:0 2px 6px rgba(0,0,0,.95),0 0 14px rgba(0,0,0,.75)}
.cn .tier{display:inline-block;margin-left:5px;font-family:var(--f-lab);
 font-size:9.5px;font-weight:700;letter-spacing:.6px;
 color:#3A1408;background:linear-gradient(120deg,var(--c1),var(--c2));
 padding:1.5px 7px;border-radius:20px;vertical-align:middle;
 text-shadow:none;box-shadow:0 1px 4px rgba(0,0,0,.4)}
/* 套餐标签：品牌红金，区别于品类标签 */
.cn .tier.combo{color:#fff;background:linear-gradient(120deg,var(--mcd-gold),var(--mcd-red));
 padding:2px 8px;font-weight:700;letter-spacing:.8px;
 box-shadow:0 2px 8px rgba(218,41,28,.5),inset 0 1px 0 rgba(255,255,255,.34)}

/* --- 数据区：独立面板，脱离图片 --- */
.panel{flex:1;padding:11px 11px 12px;
 background:linear-gradient(180deg,rgba(18,7,4,.5),rgba(18,7,4,.9))}
.price-row{display:flex;align-items:baseline;gap:6px;margin-bottom:10px;
 white-space:nowrap;overflow:hidden}
.price{font-family:var(--f-num);font-size:26px;font-weight:900;color:var(--mcd-gold);
 line-height:1;letter-spacing:.2px;text-shadow:0 0 20px rgba(255,199,44,.65);
 flex-shrink:0}
.price-unit{font-family:var(--f-lab);font-size:10.5px;color:var(--dim);font-weight:700;
 letter-spacing:1px;flex-shrink:0}

/* 首屏入口按钮 */
.hero-links{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.hlink{display:inline-flex;align-items:center;gap:6px;text-decoration:none;
 font-family:var(--f-lab);font-size:12px;font-weight:700;letter-spacing:.8px;
 color:#FFD9A0;padding:7px 15px;border-radius:16px;
 border:1px solid rgba(255,199,44,.34);background:rgba(255,199,44,.09);
 transition:.2s;backdrop-filter:blur(3px)}
.hlink:hover{background:rgba(255,199,44,.2);border-color:rgba(255,199,44,.62);
 color:#FFF0C8;transform:translateY(-1px)}

/* 热量条：数值 + 进度条 + 占日比（替代原四项营养网格） */
.kcal-row{display:flex;align-items:center;gap:9px;
 background:rgba(0,0,0,.42);border-radius:10px;padding:7px 11px;
 border:1px solid rgba(255,255,255,.07)}
.kcal-v{font-family:var(--f-num);font-size:16px;font-weight:900;color:#8FD3FF;
 line-height:1;letter-spacing:.2px;white-space:nowrap;flex-shrink:0}
.kcal-u{font-family:var(--f-lab);font-size:9.5px;font-weight:700;opacity:.65;
 letter-spacing:.3px;margin-left:2px}
.kcal-bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.10);overflow:hidden}
.kcal-fill{height:100%;border-radius:3px;
 background:linear-gradient(90deg,#5BC8FF,#8FD3FF);box-shadow:0 0 8px rgba(143,211,255,.6)}
.kcal-pct{font-family:var(--f-lab);font-size:10px;font-weight:700;color:var(--dim);
 letter-spacing:.4px;white-space:nowrap;flex-shrink:0}

/* 四个营养标签：能量 / 蛋白 / 脂肪 / 钠（2×2，卡面窄也能放下） */
.tags{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.tagchip{display:flex;align-items:center;justify-content:center;gap:4px;
 background:rgba(0,0,0,.42);border-radius:7px;padding:5px 4px;
 border:1px solid rgba(255,255,255,.07);white-space:nowrap;min-width:0}
.tagchip .tl{font-size:9px;color:var(--dim);letter-spacing:.3px;line-height:1;
 flex-shrink:0}
.tagchip .tv{font-family:var(--f-lab);font-size:12px;font-weight:700;line-height:1;
 flex-shrink:0}
.tagchip.lo .tv{color:#7FE0A0}
.tagchip.mid .tv{color:#FFC72C}
.tagchip.hi .tv{color:#FF8A76}

/* ---- 健康度徽章：右上角，含迷你进度弧 ---- */
.score{
 position:absolute;top:8px;right:8px;z-index:7;
 width:50px;height:50px;border-radius:50%;
 display:flex;align-items:center;justify-content:center;
 background:radial-gradient(circle at 50% 42%,rgba(28,12,8,.96),rgba(12,5,3,.98));
 border:1.5px solid var(--c2);
 box-shadow:0 3px 12px rgba(0,0,0,.62),0 0 16px var(--gl),inset 0 1px 4px rgba(0,0,0,.7)}
.score svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.score .tr{fill:none;stroke:rgba(255,255,255,.1);stroke-width:3.4}
.score .pg{fill:none;stroke-width:3.4;stroke-linecap:round;
 stroke:url(#sgrad);filter:drop-shadow(0 0 3px var(--gl))}
.score .inner{position:relative;z-index:2;text-align:center;line-height:1}
.score .num{font-family:var(--f-num);font-size:16px;font-weight:900;color:#fff;
 letter-spacing:-.3px;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.score .cap{font-family:var(--f-lab);font-size:7px;font-weight:700;letter-spacing:.7px;
 color:var(--c1);margin-top:2px}
.card.t-SSR .score{animation:scoreGlow 2.1s ease-in-out infinite}
@keyframes scoreGlow{
 0%,100%{box-shadow:0 3px 12px rgba(0,0,0,.62),0 0 8px var(--gl),inset 0 1px 4px rgba(0,0,0,.7)}
 50%    {box-shadow:0 3px 12px rgba(0,0,0,.62),0 0 14px 3px var(--gl),inset 0 1px 4px rgba(0,0,0,.7)}
}

/* NEW 徽标：右上角分数下方，避免与分数徽章重叠 */
.new{position:absolute;top:62px;right:8px;z-index:7;
 background:linear-gradient(120deg,var(--mcd-gold),var(--mcd-gold-d));color:#3A1408;
 font-family:var(--f-lab);font-size:8.5px;font-weight:700;padding:2.5px 8px;border-radius:20px;
 letter-spacing:1.1px;box-shadow:0 3px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.5);
 animation:newPulse 1.5s ease-in-out infinite}
@keyframes newPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.dup{position:absolute;bottom:11px;right:11px;z-index:6;font-size:9.5px;font-weight:900;
 background:rgba(255,199,44,.3);border:1px solid rgba(255,199,44,.44);
 padding:2px 8px;border-radius:20px;color:#FFE9B8}

.lock{text-align:center;padding:58px 20px;color:#B08D7C;
 border:2px dashed rgba(255,199,44,.28);border-radius:16px}
.lock .e{font-size:40px;margin-bottom:12px}

/* ============ 抽卡演出层 ============ */
.stage{position:fixed;inset:0;z-index:200;display:none;
 align-items:center;justify-content:center;perspective:1100px}
.stage.on{display:flex}

/* SSR 全屏金色演出 */
.ssr-veil{position:absolute;inset:0;pointer-events:none;opacity:0;
 background:radial-gradient(ellipse at 50% 50%,rgba(255,231,168,.42),transparent 62%)}
.ssr-veil.on{animation:veil 1.5s ease-out}
@keyframes veil{0%{opacity:0}22%{opacity:1}100%{opacity:0}}

.rays{position:absolute;width:220vmax;height:220vmax;pointer-events:none;opacity:0;
 background:repeating-conic-gradient(from 0deg,
  rgba(255,199,44,.16) 0deg 5deg,transparent 5deg 13deg);
 animation:spin 9s linear infinite}
.rays.on{opacity:1;animation:spin 9s linear infinite,rayIn 1.2s ease-out}

 100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.15)}}

 78%{transform:translate3d(0,-5px,0) rotateZ(-1.4deg)}
 100%{transform:translate3d(0,0,0) rotateZ(0)}
}
.flip-face{position:absolute;inset:0;border-radius:19px;backface-visibility:hidden;

.back{background:linear-gradient(155deg,var(--mcd-red),var(--mcd-red-d) 62%,#5E0D05);
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 border:3px solid var(--mcd-gold);
 box-shadow:0 0 0 1px rgba(255,255,255,.12),0 22px 60px rgba(0,0,0,.65),
            0 0 70px rgba(255,199,44,.34)}
.back::before{content:"";position:absolute;inset:11px;border-radius:12px;
 border:1.5px solid rgba(255,199,44,.44)}
.back .m{font-size:74px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
.back .t{color:var(--mcd-gold);font-size:20px;font-weight:900;letter-spacing:5px;
 margin-top:14px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.back .s{color:#FFD9A0;font-size:11.5px;margin-top:7px;letter-spacing:2px}

/* 卡背脉动 */
.back{animation:backPulse 1.6s ease-in-out infinite}
@keyframes backPulse{
 0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.12),0 22px 60px rgba(0,0,0,.65),0 0 56px rgba(255,199,44,.26)}
 50%    {box-shadow:0 0 0 1px rgba(255,255,255,.12),0 22px 60px rgba(0,0,0,.65),0 0 96px rgba(255,199,44,.55)}
}

/* 正面（翻开后） */
.front{transform:rotateY(180deg)}
.front .card{width:100%;height:100%}
.front .card-in{height:100%;min-height:0}
.front .art{height:52%}
.front .panel{flex:1;display:flex;flex-direction:column;justify-content:center}

/* SSR 额外光效 */
.front.ssr-show .card-in{box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),
 inset 0 -30px 46px rgba(0,0,0,.42),0 0 46px rgba(255,199,44,.62)}
.ssr-word{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
 z-index:10;font-size:76px;font-weight:900;letter-spacing:8px;color:#fff;
 text-shadow:0 0 22px var(--mcd-gold),0 0 44px var(--mcd-red),0 5px 12px rgba(0,0,0,.6);
 pointer-events:none;opacity:0}
.ssr-word.on{animation:ssrWord 1.25s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes ssrWord{
 0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-14deg)}
 32%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(3deg)}
 46%{transform:translate(-50%,-50%) scale(1) rotate(0)}
 78%{opacity:1}
 100%{opacity:0;transform:translate(-50%,-50%) scale(1.32)}
}

.stage-hint{position:absolute;bottom:9%;z-index:12;color:#FFE9B8;font-size:13px;
 font-weight:700;letter-spacing:2px;opacity:0;pointer-events:none}
.stage-hint.on{animation:hintIn .6s ease .9s forwards}
@keyframes hintIn{to{opacity:.92}}

.stage-collected{position:absolute;top:12%;z-index:13;
 display:inline-flex;align-items:center;gap:7px;
 padding:6px 15px;border-radius:20px;pointer-events:none;
 background:linear-gradient(120deg,rgba(58,20,8,.94),rgba(28,12,8,.94));
 border:1px solid rgba(255,199,44,.55);
 box-shadow:0 6px 20px rgba(0,0,0,.55),0 0 18px rgba(255,199,44,.28);
 opacity:0;transform:translateY(-10px) scale(.9);

.stage-collected .sc-ico{font-size:13px;font-weight:900;color:#7FE0A0}

@keyframes scIn{
 0%{opacity:0;transform:translateY(-10px) scale(.9)}

/* ============ 弹窗 ============ */

.mbox{background:#1E0B07;border:2px solid rgba(255,199,44,.32);border-radius:17px;

@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* 稀有度说明块：明确「稀有≠健康」 */
.rarity-note{background:rgba(255,199,44,.07);border-left:3px solid var(--mcd-gold);
 border-radius:6px;padding:9px 11px;margin-bottom:11px;

footer{margin-top:42px;padding-top:20px;border-top:2px solid rgba(255,199,44,.2);

/* ---------- 积分账本（网页版：不做时间恢复，改为手动刷新重置） ---------- */
const MAX_POINTS = 30;      // 单次刷新补满的上限
const COOLDOWN_MS = 60000;  // 刷新冷却，防止连点刷分

let led = load();
function load(){
  try{
    const o = JSON.parse(localStorage.getItem(LS));
    if(o && typeof o.points === "number") return o;
  }catch(e){}
  return {points:META.initialPoints, lastRefill:0, totalDraws:0, collection:[]};
}
function save(){ localStorage.setItem(LS, JSON.stringify(led)); }

/** 刷新重置：补满至 MAX_POINTS，带60 秒冷却 */
function refill(){
  const now = Date.now();
  if(now - (led.lastRefill||0) < COOLDOWN_MS) return false;
  led.points = MAX_POINTS;
  led.lastRefill = now;
  save();
  return true;
}
function refillLeft(){
  return Math.max(0, COOLDOWN_MS - (Date.now() - (led.lastRefill||0)));
}

/* ---------- 抽卡（与gacha.py 同算法：按稀有度加权 → 档内等概率） ---------- */
function drawOne(budget){
  let pool = CARDS;
  if(budget != null && budget > 0){
    pool = CARDS.filter(c => c.price <= budget);
    if(!pool.length) return null;
  }
  const byR = {};
  pool.forEach(c => (byR[c.rarity] = byR[c.rarity] || []).push(c));
  const rs = Object.keys(byR), w = rs.map(r => META.weights[r] || 1);
  // 加权随机
  const tot = w.reduce((a,b)=>a+b,0);
  let x = Math.random() * tot, pick = rs[0];
  for(let i=0;i<rs.length;i++){ x -= w[i]; if(x <= 0){ pick = rs[i]; break; } }
  const arr = byR[pick];
  return arr[Math.floor(Math.random() * arr.length)];
}

/* ---------- 渲染 ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

/* 卡面：图片为主体（不遮挡），数据独立面板，健康度为右上角环形徽章 */
function scoreBadge(c){
  const pct = Math.max(0, Math.min(100, c.health_score));
  const R = 21, C = 2 * Math.PI * R;          // 半径与周长
  const dash = (pct / 100 * C).toFixed(2);
  return `<div class="score" title="健康度 ${c.health_score.toFixed(1)} / 100">
    <svg viewBox="0 0 50 50"><circle class="tr" cx="25" cy="25" r="${R}"/>
      <circle class="pg" cx="25" cy="25" r="${R}" stroke-dasharray="${dash} ${C}"/></svg>
    <div class="inner"><div class="num">${c.health_score.toFixed(0)}</div>
      <div class="cap">健康度</div></div>
  </div>`;
}

function cardHtml(c, isNew, isLast, inStage){
  const emoji = EMO[c.category] || "🍽️";
  const click = inStage ? "" : ` onclick='showCard(${JSON.stringify(c).replace(/'/g,"&#39;")})'`;
  const art = c.image_url
    ? `<img src="${esc(c.image_url)}" alt="${esc(c.name)}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=&quot;ph&quot;>${emoji}</div>'">`
    : `<div class="ph"><div class="ph-ico">${emoji}</div><div class="ph-txt">${esc(c.category || "")}</div></div>`;

  const foil = c.foil || "";
  // 特效层覆盖**整张卡面**（.card-in 内），不加描边
  const foilLayer = foil
    ? `<div class="foil foil-${foil}"></div>
       <div class="foil-halo ${foil}"></div>
       ${foil === "flash" ? '<div class="foil foil-halo flash-glow"></div>' : ""}` : "";
  const foilMark = foil
    ? `<div class="foil-mark ${foil}">${({flash:"闪卡",silver:"银碎",gold:"金卡"})[foil]}</div>` : "";

  return `<div class="card t-${c.rarity}" style="background:linear-gradient(150deg,var(--c1),var(--c2) 46%,var(--c3));box-shadow:0 6px 22px var(--gl)"${click}>
  <div class="card-in" style="background:linear-gradient(165deg,var(--c3),#140806 62%)">
    <div class="rar-tag" title="收藏价值 ${(c.rarity_value||0).toFixed(2)} · 价格50%+热量30%+蛋白20%"><span>${c.rarity}</span></div>
    ${scoreBadge(c)}
    ${isNew ? '<div class="new">NEW</div>' : ""}
    ${foilLayer}
    <div class="art">${art}</div>
    <div class="cn">${esc(c.name)}${c.is_combo
      ? `<span class="tier combo">套餐</span>`
      : `<span class="tier">${esc(c.category)}</span>`}${c.is_variant
      ? `<span class="tier flashvar">闪卡版</span>` : ""}${foilMark}</div>
    <div class="panel">
      <div class="price-row">
        <span class="price">¥${c.price.toFixed(2)}</span>
        <span class="price-unit">门店价</span>
      </div>
      <div class="kcal-row">
        <div class="kcal-v">${c.calories.toFixed(0)}<span class="kcal-u">kcal</span></div>
        <div class="kcal-bar" title="占每日参考摄入 ${c.meal_share||(c.calories/20).toFixed(1)}%">
          <div class="kcal-fill" style="width:${Math.min(100,(c.calories/1000)*100).toFixed(0)}%"></div>
        </div>
        <div class="kcal-pct">占日 ${(c.calories/20).toFixed(0)}%</div>
      </div>
    </div>
    ${(isLast && c.duplicate_count > 1) ? `<div class="dup">×${c.duplicate_count}</div>` : ""}
  </div>
</div>`;
}

function tagChip(label, val){
  const v = val || "—";
  const cls = v === "高" ? "hi" : (v === "低" ? "lo" : "mid");
  return `<div class="tagchip ${cls}"><span class="tl">${label}</span><span class="tv">${esc(v)}</span></div>`;
}

function renderAll(){
  $("ptNum").textContent = led.points;
  renderRefillBtn();

  const d = {SSR:0, UR:0, R:0};
  let nCombo = 0;
  led.collection.forEach(c => { d[c.rarity]++; if(c.is_combo) nCombo++; });
  const n = led.collection.length || 1;
  const avgK = n ? (led.collection.reduce((s,c)=>s+c.calories,0)/n).toFixed(0) : 0;
  const avgH = n ? (led.collection.reduce((s,c)=>s+c.health_score,0)/n).toFixed(1) : 0;

  // 底部细窄数据带
  $("stats").innerHTML = [
    ["", "已收集", led.collection.length, ""],
    ["ssr", "SSR", d.SSR, ""],
    ["ur", "UR", d.UR, ""],
    ["r", "R", d.R, ""],
    ["combo", "套餐", nCombo, ""],
    ["", "均热量", avgK, "kcal"],
    ["", "总抽卡", led.totalDraws, ""]
  ].map(([cls,k,v,u]) =>
    `<div class="stat${cls?" "+cls:""}"><span class="v">${v}${u?`<span style="font-size:9px;opacity:.7">${u}</span>`:""}</span><span class="k">${k}</span></div>`
  ).join("");

  // 收藏册（按稀有度 + 健康度排序）
  const order = {SSR:0, UR:1, R:2};
  const sorted = led.collection.slice().sort((a,b)=> order[a.rarity]-order[b.rarity] || b.health_score-a.health_score);
  $("colInfo").textContent = `${led.collection.length} / ${CARDS.length}`;
  // 本次抽到的卡在收藏册里带 NEW 徽标
  $("colBox").innerHTML = sorted.length
    ? sorted.map(c => cardHtml(c, drawnIds.has(c.id), c.duplicate_count > 1)).join("")
    : `<div class="lock" style="grid-column:1/-1"><div class="e">📦</div>收藏册还是空的，点上方按钮抽第一张</div>`;

  const canDraw = led.points >= 1;
  $("btnDraw").disabled = !canDraw;
  renderShelf();
  const catLine = (META.categoryCount
    ? ` · 覆盖 <b>${META.categoryCount}</b> 个品类（牛堡 / 鸡堡 / 麦满分 / 咖啡 / 饮品 …）`
    : "");
  $("hint").innerHTML = canDraw
    ? `全品类卡池 <b>${CARDS.length}</b> 张${catLine} · 套餐 ${META.comboCount} · SSR <b>5%</b> / UR <b>20%</b> / R <b>75%</b>`
    : `<span class="warn">积分不足</span> · 点击右上角「刷新积分」立即补满至 ${MAX_POINTS} 分`;
}

let busy = false;

let skipped = false;
const drawnIds = new Set();   // 本次抽到的卡 id，用于收藏册 NEW 标记

function burst(el, n){
  for(let i=0;i<n;i++){
    const b = document.createElement("div");
    b.className = "ssr-burst";
    const ang = (Math.PI*2*i)/n + Math.random()*.5;
    const dist = 130 + Math.random()*170;
    b.style.setProperty("--dx", Math.cos(ang)*dist + "px");
    b.style.setProperty("--dy", Math.sin(ang)*dist + "px");
    b.style.left = (44 + Math.random()*12) + "%";
    b.style.top = (44 + Math.random()*12) + "%";
    b.style.animation = `burst ${.75 + Math.random()*.55}s ease-out ${Math.random()*.14}s forwards`;
    el.appendChild(b);
    setTimeout(() => b.remove(), 1500);
  }
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

/* 单张翻牌演出：卡背 -> 稀有度特效 -> 翻面 */
async function revealCard(card){
  const stage = $("stage"), flip = $("flip"), front = $("flipFront");
  const isSSR = card.rarity === "SSR", isUR = card.rarity === "UR";
  const isR = !isSSR && !isUR;

  // SSR 排在多抽里最后揭幕，享受最完整的演出
  if(isSSR) $("rays").classList.add("on");

  stage.classList.add("on");
  flip.classList.remove("go");
  front.innerHTML = cardHtml(card, false, false, true);
  front.classList.remove("ssr-show");
  $("ssrVeil").classList.remove("on");
  $("urVeil").classList.remove("on");
  $("ssrWord").classList.remove("on");
  $("stageHint").classList.remove("on");

  // 前置：卡背从远处飞入并带旋转落位，营造"召唤"仪式感
  flip.classList.remove("summon");
  void flip.offsetWidth;              // 强制重排以重启动画
  flip.classList.add("summon");

  await sleep(isSSR ? 900 : 620);

  // 开奖瞬间的光效
  if(isSSR){ $("ssrVeil").classList.add("on"); burst(stage, 40); }
  else if(isUR){ $("urVeil").classList.add("on"); burst(stage, 16); }
  else { burst(stage, 5); }

  flip.classList.add("go");

  if(isSSR){
    await sleep(400);
    front.classList.add("ssr-show");
    $("ssrWord").classList.add("on");
    await sleep(520);
    $("stageHint").classList.add("on");
    await sleep(900);
  }else{
    await sleep(isUR ? 780 : 620);
  }
}

/* 关闭演出 */
function closeStage(){
  const stage = $("stage");
  stage.classList.remove("on");
  $("rays").classList.remove("on");
  $("ssrVeil").classList.remove("on");
  $("urVeil").classList.remove("on");
  $("ssrWord").classList.remove("on");
  $("stageHint").classList.remove("on");
  $("stageCollected").classList.remove("on");
  $("flip").classList.remove("go");
  $("flip").classList.remove("summon");
  $("flipFront").classList.remove("ssr-show");
}

async function doDraw(){
  if(busy) return;
  const n = Math.max(1, Math.min(20, parseInt($("inpDraw").value) || 1));
  const bv = $("inpBudget").value.trim();
  const budget = bv === "" ? null : parseFloat(bv);
  if(led.points < n){
    alert(`积分不足：抽 ${n} 次需要 ${n} 分，当前 ${led.points} 分。\n\n点击右上角「刷新积分」可立即补满至 ${MAX_POINTS} 分。`);
    return;
  }
  const pool = (budget == null || budget <= 0) ? CARDS : CARDS.filter(c => c.price <= budget);
  if(!pool.length){ alert(`预算 ${budget} 元内没有可抽取的餐品。`); return; }

  // 先把结果算出来但**不落库**，等每张卡演完再加入收藏册
  const drawn = [];
  for(let i=0;i<n;i++){
    const c = drawOne(budget);
    if(c) drawn.push(c);
  }
  if(!drawn.length){ alert("没有抽到卡片，请重试"); return; }

  led.points -= drawn.length * META.costPerDraw;
  led.totalDraws += drawn.length;
  save();

  busy = true;
  $("btnDraw").disabled = true;
  renderAll();

  // 演出排序：SSR 最后翻（压轴），UR 次之
  const order = {R:0, UR:1, SSR:2};
  const seq = drawn.slice().sort((a,b) => order[a.rarity] - order[b.rarity]);

  for(let i=0;i<seq.length;i++){
    // 非最后一张时禁用跳过，保证多抽的逐张节奏
    allowSkip = (i === seq.length - 1);
    await revealCard(seq[i]);
    // ★ 这张演完了，才加入收藏册并保存
    commitToCollection(seq[i]);
    if(skipped){
      // 跳过：把剩余未演出的卡一次性补录（数据不丢）
      for(let j=i+1;j<seq.length;j++) commitToCollection(seq[j]);
      skipped = false;
      break;
    }
  }
  closeStage();
  allowSkip = false;

  busy = false;
  renderAll();          // 此时 drawnIds 仍有效，收藏册显示 NEW
  // 新获得的卡在收藏册顶部，滚动到该处
  $("colBox").scrollIntoView({behavior:"smooth", block:"start"});
  setTimeout(() => { drawnIds.clear(); }, 4000);   // 4 秒后撤掉 NEW 标记
}

/* 单张卡演出完成后才写入收藏册（去重计数 + NEW 标记 + 持久化） */
function commitToCollection(c){
  const ex = led.collection.find(x => x.id === c.id);
  if(ex){
    ex.duplicate_count = (ex.duplicate_count || 1) + 1;
    c.duplicate_count = ex.duplicate_count;
  }else{
    c.duplicate_count = 1;
    c.obtained_at = new Date().toLocaleString("zh-CN");
    led.collection.push(JSON.parse(JSON.stringify(c)));
  }
  drawnIds.add(c.id);
  save();
  renderAll();          // 立刻刷新卡册，让这张卡带着 NEW 出现
  // 演出层内给出「已加入收藏册」的可视反馈
  const sc = $("stageCollected");
  if(sc){
    sc.classList.remove("on");
    void sc.offsetWidth;      // 强制重排以重启动画
    sc.classList.add("on");
  }
}

/* Hero 图鉴：展示已收集卡，未收集显示锁定剪影；无收藏时展示卡池精选 */
let shelfTimer = 0;
function renderShelf(){
  const box = $("heroShelf");
  if(!box) return;
  const owned = new Set(led.collection.map(c => c.id));

  // 已收集优先（按稀有度与分数排序），否则用卡池前三作展示位
  let pool = led.collection.length
    ? led.collection.slice().sort((a,b)=>{
        const o = {SSR:0,UR:1,R:2};
        return o[a.rarity]-o[b.rarity] || b.health_score-a.health_score;
      })
    : CARDS.slice().sort((a,b)=>{
        const o = {SSR:0,UR:1,R:2};
        return o[a.rarity]-o[b.rarity] || b.health_score-a.health_score;
      }).slice(0,3);

  // 取 3 张作为 左/中/右 展示位；若已收集不足，用未收集的补位（显剪影）
  const locked = CARDS.filter(c => !owned.has(c.id))
                      .sort((a,b)=>{
                        const o = {SSR:0,UR:1,R:2};
                        return o[b.rarity]-o[a.rarity];      // 越稀有越靠前
                      });
  const picks = [];
  for(let i=0;i<3;i++){
    picks.push(pool[i] || locked[i] || null);
  }

  box.innerHTML = picks.map((c,i) => {
    if(!c) return `<div class="hs-card locked"><div class="hs-name">?</div></div>`;
    const got = owned.has(c.id);
    const rar = (RAR[c.rarity]||RAR.R);
    return `<div class="hs-card${got?"":" locked"}">
      <img src="${esc(c.image_url||"")}" alt="" loading="lazy"
        onerror="this.style.display='none'">
      <span class="hs-rar" style="background:linear-gradient(120deg,${rar.c1},${rar.c2})">${c.rarity}</span>
      <div class="hs-name">${esc(c.name.length>7 ? c.name.slice(0,6)+"…" : c.name)}</div>
    </div>`;
  }).join("");

  // 自动轮播：每3.6 秒换一组
  if(shelfTimer) clearInterval(shelfTimer);
  if(led.collection.length >= 3){
    let k = 0;
    shelfTimer = setInterval(() => {
      const owned = led.collection.slice().sort((a,b)=>{
        const o = {SSR:0,UR:1,R:2};
        return o[a.rarity]-o[b.rarity] || b.health_score-a.health_score;
      });
      if(owned.length < 3) return;
      k = (k + 1) % owned.length;
      const trio = [owned[(k-1+owned.length)%owned.length], owned[k], owned[(k+1)%owned.length]];
      box.innerHTML = trio.map(c => {
        const rar = (RAR[c.rarity]||RAR.R);
        return `<div class="hs-card">
          <img src="${esc(c.image_url||"")}" alt="" loading="lazy" onerror="this.style.display='none'">
          <span class="hs-rar" style="background:linear-gradient(120deg,${rar.c1},${rar.c2})">${c.rarity}</span>
          <div class="hs-name">${esc(c.name.length>7 ? c.name.slice(0,6)+"…" : c.name)}</div>
        </div>`;
      }).join("");
    }, 3600);
  }
}

/* ---------- 轻提示 toast ---------- */
let toastTimer = null;
function toast(msg){
  let t = $("toast");
  if(!t){
    t = document.createElement("div");
    t.id = "toast";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 2200);
}
function esc2(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function showErr(boxId, msg){
  const b = $(boxId);
  if(!b) return;
  b.innerHTML = msg ? `<div class="err">${esc2(msg)}</div>` : "";
}
async function api(path, payload){
  const r = await fetch(path, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(payload || {})
  });
  let j;
  try { j = await r.json(); }
  catch(_){ throw new Error("服务返回异常（HTTP " + r.status + "）"); }
  if(!j.success) throw new Error(j.error || ("请求失败 HTTP " + r.status));
  return j;
}

    $("storeList").innerHTML = j.stores.map((s,i) => `
      <button class="sitem${STORE && STORE.storeCode===s.storeCode ? " on":""}"
              data-i="${i}">
        <div class="nm">${esc2(s.name)}</div>
        <div class="mt">
          <span class="dist">${esc2(s.distanceText)}</span>
          <span>${esc2(s.address || "")}</span>
          ${s.open ? `<span>营业 ${esc2(s.open)}</span>` : ""}
        </div>
      </button>`).join("");
    [...$("storeList").children].forEach(btn2 => {
      btn2.addEventListener("click", () => {
        const s = j.stores[parseInt(btn2.dataset.i, 10)];
        saveStore({...s, city, keyword: kw, beType: BE_TYPE});
        [...$("storeList").children].forEach(x => x.classList.remove("on"));
        btn2.classList.add("on");
        setTimeout(() => closeMask("maskStore"), 220);
      });
    });
  }catch(e){
    showErr("storeErr", e.message);
  }finally{
    btn.disabled = false; btn.textContent = "查找附近门店";
  }
});

/* ---------- 卡面「立即购买」：真实核价 + 二次确认 ---------- */
function buyCard(c){
  if(!STORE){
    alert("请先点击页面顶部「选择你附近的麦当劳」，查询并选中门店后再下单。\n\n（这样价格才是你所在门店的真实售价）");
    openMask("maskStore");
    return;
  }
  const body = $("orderBody");
  body.innerHTML = `<h3>正在核价…</h3><div class="sub">${esc2(STORE.name)}</div>`;
  openMask("maskOrder");
  api("/api/order", {
    step: "quote",
    beType: STORE.beType || BE_TYPE,
    store: STORE,
    items: [{productCode: c.product_code || c.id, quantity: 1}]
  }).then(j => {
    const p = j.price || {};
    const total = (p.price != null ? p.price : p.totalPrice);
    body.innerHTML = `
      <h3>确认订单</h3>
      <div class="sub">${esc2(STORE.name)} · ${esc2(STORE.distanceText || "")}</div>
      <div class="sum">
        <div class="ln"><span>餐品</span><span>${esc2(c.name)}</span></div>
        <div class="ln"><span>数量</span><span>1</span></div>
        ${p.discount ? `<div class="ln"><span>优惠</span><span>-¥${esc2(p.discount)}</span></div>` : ""}
        ${p.deliveryPrice ? `<div class="ln"><span>配送费</span><span>¥${esc2(p.deliveryPrice)}</span></div>` : ""}
        <div class="ln tot"><span>应付</span><span>¥${esc2(total != null ? total : c.price)}</span></div>
      </div>
      <div class="hint">
        这是<b>真实订单</b>，确认后将通过麦当劳官方通道下单并生成支付链接。<br>
        请核对餐品与门店后再继续。
      </div>
      <button class="sbtn" id="btnDoOrder">确认下单</button>
      <button class="sbtn ghost" id="btnCancelOrder">再想想</button>`;
    $("btnDoOrder").addEventListener("click", () => {
      const b = $("btnDoOrder");
      b.disabled = true; b.textContent = "提交订单中…";
      api("/api/order", {step:"confirm", quoteToken: j.quoteToken})
        .then(r => {
          const o = r.order || {};
          body.innerHTML = `
            <div class="ok">
              <div class="tick">🎉</div>
              <h3>下单成功</h3>
              <div class="oid">订单号：${esc2(o.orderId || "—")}</div>
              ${o.payUrl ? `<a class="paylink" href="${esc2(o.payUrl)}" target="_blank" rel="noopener">前往支付 ¥${esc2(total != null ? total : c.price)}</a>` : ""}
              <div class="hint">请在订单有效期内完成支付，超时订单可能自动取消。</div>
            </div>
            <button class="sbtn ghost" id="btnDone">完成</button>`;
          $("btnDone").addEventListener("click", () => closeMask("maskOrder"));
        })
        .catch(e => {
          b.disabled = false; b.textContent = "确认下单";
          body.insertAdjacentHTML("afterbegin", `<div class="err">${esc2(e.message)}</div>`);
        });
    });
    $("btnCancelOrder").addEventListener("click", () => closeMask("maskOrder"));
  }).catch(e => {
    body.innerHTML = `<h3>核价失败</h3><div class="err">${esc2(e.message)}</div>
      <button class="sbtn ghost" id="btnBack">返回</button>`;
    $("btnBack").addEventListener("click", () => closeMask("maskOrder"));
  });
}

/* Hero 视差：背景随鼠标轻微位移 + 金色粒子漂浮 */
(function heroFx(){
  const hero = document.querySelector(".hero");
  const bg = $("heroBg");
  const box = $("heroCards");
  if(!hero || !bg) return;

  // 金色粒子（纯 CSS 动画，数量控制在 14 个以内）
  let ps = "";
  for(let i=0;i<14;i++){
    const x = 52 + Math.random()*46;      // 集中在右侧卡牌区
    const y = Math.random()*100;
    const d = 4 + Math.random()*7;
    const dur = 5 + Math.random()*6;
    const del = (Math.random()*6).toFixed(2);
    ps += `<i style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%;width:${d}px;height:${d}px;
      animation-duration:${dur.toFixed(1)}s;animation-delay:-${del}s"></i>`;
  }
  box.innerHTML = ps;

  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  if(matchMedia("(hover:none)").matches) return;      // 触屏不做视差

  let raf = 0;
  hero.addEventListener("mousemove", e => {
    if(raf) return;
    raf = requestAnimationFrame(() => {
      const r = hero.getBoundingClientRect();
      const dx = (e.clientX - r.left) / r.width - 0.5;
      const dy = (e.clientY - r.top) / r.height - 0.5;
      bg.style.transform = `scale(1.04) translate(${(-dx*14).toFixed(1)}px, ${(-dy*10).toFixed(1)}px)`;
      bg.style.transition = "transform .25s ease-out";
      raf = 0;
    });
  });
  hero.addEventListener("mouseleave", () => {
    bg.style.transform = "scale(1)";
    bg.style.transition = "transform .6s ease";
  });
})();
